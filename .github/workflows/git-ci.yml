
name: GitHub Actions Demo

on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo 123 > test.html
      - uses: actions/upload-artifact@v7
        with:
          path: test.html

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
      - run: test -f test.html
